{% extends 'base.html' %}
{% block content %}
<div class="form-wrap">
    <div class="form-card">
        <p class="eyebrow">Acceso al sistema</p>
        <h2 class="form-title">Bienvenido</h2>
        <p class="form-sub">Ingresa con tu RUT y clave para continuar</p>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label class="input-label">RUT</label>
            <input class="input-field" name="rut" placeholder="12.345.678-9">
            <label class="input-label">Clave</label>
            <input class="input-field input-field-last" name="password" type="password" placeholder="••••••••">
            <button type="submit" class="btn-primary">Ingresar</button>
        </form>
    </div>
</div>
{% endblock %}
