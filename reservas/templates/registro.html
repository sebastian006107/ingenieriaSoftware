{% extends 'base.html' %}
{% block content %}
<div class="form-wrap">
    <div class="form-card form-card-wide">
        <p class="eyebrow">Nuevo usuario</p>
        <h2 class="form-title-lg">Crear cuenta</h2>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label class="input-label">Nombre</label>
            <input class="input-field" name="nombre" placeholder="Juan">
            <label class="input-label">Apellido</label>
            <input class="input-field" name="apellido" placeholder="González">
            <label class="input-label">RUT</label>
            <input class="input-field" name="rut" placeholder="12.345.678-9">
            <label class="input-label">Correo electrónico</label>
            <input class="input-field" name="email" type="email" placeholder="correo@ejemplo.com">
            <label class="input-label">Clave</label>
            <input class="input-field input-field-last" name="password" type="password" placeholder="••••••••">
            <button type="submit" class="btn-primary">Crear cuenta</button>
        </form>
        <p class="form-link">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a></p>
    </div>
</div>
{% endblock %}
